services:
  postgres:
    image: postgres:16-alpine
    container_name: agenda_atende_pg
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agenda_atende
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_atende"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenda_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: agenda_atende_api
    environment:
      - DATABASE_URL=postgresql://agenda_user:${POSTGRES_PASSWORD}@postgres:5432/agenda_atende
      - API_KEY=${API_KEY}
      - APP_NAME=${APP_NAME}
      - DEBUG=false
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_BASE_URL=${ASAAS_BASE_URL}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - agenda_network

  nginx:
    image: nginx:alpine
    container_name: agenda_atende_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - agenda_network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - agenda_network

volumes:
  pgdata:

networks:
  agenda_network:
    driver: bridge