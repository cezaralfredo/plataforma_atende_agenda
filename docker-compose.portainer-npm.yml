# Stack para Portainer Community Edition com Nginx Proxy Manager já existente.
# Não publique portas: no NPM, crie um Proxy Host para agenda-api:8000.
# Defina as variáveis abaixo na tela Environment variables da Stack.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Portainer}
      POSTGRES_DB: agenda_atende
    volumes:
      - agenda_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_atende"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agenda_db_internal

  api:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-cezaralfredo/plataforma_atende_agenda}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://agenda_user:${POSTGRES_PASSWORD}@postgres:5432/agenda_atende
      API_KEY: ${API_KEY:?Defina API_KEY no Portainer}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY no Portainer}
      ADMIN_USERNAME: "admin"
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Defina ADMIN_SESSION_SECRET no Portainer}
      ADMIN_RECOVERY_KEY: ${ADMIN_RECOVERY_KEY:?Defina ADMIN_RECOVERY_KEY no Portainer}
      APP_NAME: ${APP_NAME:-Agenda Atende}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DEBUG: "false"
      ASAAS_API_KEY: ${ASAAS_API_KEY:?Defina ASAAS_API_KEY no Portainer}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Defina ASAAS_WEBHOOK_TOKEN no Portainer}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/pagamento-confirmado}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      npm:
        aliases:
          - agenda-api
      mcp_internal:
      agenda_db_internal:

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: agenda_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-147.224.215.151}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://147.224.215.151:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - npm
      - mcp_internal
      - agenda_db_internal

volumes:
  agenda_db_data:
  n8n_data:

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
  mcp_internal:
    external: true
    name: ${AGENDA_MCP_NETWORK:-agenda_mcp_internal}
  agenda_db_internal:
    driver: bridge
