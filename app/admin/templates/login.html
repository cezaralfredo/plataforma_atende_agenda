<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Agenda Atende</title>
    <style>
        body { margin: 0; background: #f8fafc; color: #0f172a; font: 1rem/1.5 system-ui, sans-serif; }
        main { max-width: 26rem; margin: 8vh auto; padding: 2rem; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input, button { box-sizing: border-box; width: 100%; padding: .75rem; border-radius: .5rem; font: inherit; }
        input { border: 1px solid #94a3b8; }
        button { margin-top: 1.5rem; background: #2563eb; color: white; border: 0; cursor: pointer; }
        a { color: #1d4ed8; } [role="alert"] { color: #991b1b; }
    </style>
</head>
<body>
    <main>
        <p>Agenda Atende · Administração</p>
        <h1>Entrar no painel</h1>
        <p>Informe seu usuário e sua senha para continuar.</p>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <form action="/admin/login" method="post">
            <label for="username">Usuário</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>
        <p><a href="/admin/recover">Esqueci minha senha</a></p>
    </main>
</body>
</html>
