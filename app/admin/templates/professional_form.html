{% extends "base.html" %}
{% block title %}{% if professional %}Editar{% else %}Novo{% endif %} Profissional - Agenda Atende{% endblock %}
{% block page_title %}{% if professional %}Editar Profissional{% else %}Novo Profissional{% endif %}{% endblock %}
{% block content %}
<div class="max-w-2xl">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <form method="post"
              action="{% if professional %}/admin/professionals/{{ professional.id }}/update{% else %}/admin/professionals{% endif %}"
              class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome *</label>
                <input type="text" name="name" value="{{ professional.name if professional else '' }}" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                    <input type="text" name="phone" value="{{ professional.phone or '' if professional else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="5585999999999">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" name="email" value="{{ professional.email or '' if professional else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
                <textarea name="bio" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg">{{ professional.bio or '' if professional else '' }}</textarea>
            </div>
            <div>
                <label class="flex items-center">
                    <input type="checkbox" name="active" value="1" {% if not professional or professional.active %}checked{% endif %}
                           class="h-4 w-4 text-indigo-600 border-gray-300 rounded">
                    <span class="ml-2 text-sm text-gray-700">Ativo</span>
                </label>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    <i class="fas fa-save mr-1"></i> Salvar
                </button>
                <a href="/admin/professionals" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
